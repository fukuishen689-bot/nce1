<style>
/* Layout: one narrow reading column, built for thumb use; lesson list → lesson view with three tabs, controls pinned near the bottom of each card */
:root{
  --bg:#EEF0EE; --surface:#F8F9F7; --ink:#1F2629; --muted:#66706F; --line:#D5DAD6;
  --sea:#3F6670; --sea-soft:#DCE6E6; --rec:#A5503F; --ok:#4E7A5A;
  --f-en:"Newsreader",Georgia,"Times New Roman",serif;
  --f-zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161B1D; --surface:#1E2427; --ink:#E4E8E6; --muted:#97A19F; --line:#2F383B;
  --sea:#86AFB8; --sea-soft:#25363A; --rec:#D98C79; --ok:#8DBB98; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161B1D; --surface:#1E2427; --ink:#E4E8E6; --muted:#97A19F; --line:#2F383B;
  --sea:#86AFB8; --sea-soft:#25363A; --rec:#D98C79; --ok:#8DBB98; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-zh);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.en{font-family:var(--f-en)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 0 14px}
header.top h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.02em}
header.top .sub{color:var(--muted);font-size:12px}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--sea);color:var(--surface);border-radius:14px;padding:16px 18px;margin-bottom:22px}
.resume small{display:block;opacity:.8;font-size:12px}
.resume .en{font-size:21px;line-height:1.25}
.resume .go{font-size:13px;white-space:nowrap;border:1px solid currentColor;border-radius:99px;padding:4px 12px;opacity:.9}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  padding:13px 2px;border-bottom:1px solid var(--line)}
.row .num{color:var(--muted);font-size:12px}
.row .t{font-family:var(--f-en);font-size:18px;line-height:1.25;min-width:0}
.row .g{display:block;font-family:var(--f-zh);font-size:12px;color:var(--muted);margin-top:2px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dot.part{border-color:var(--sea)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.note{color:var(--muted);font-size:12.5px;margin-top:18px;line-height:1.7}

/* lesson view */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;display:flex;flex-direction:column;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .head{display:flex;align-items:center;gap:10px}
.back{font-size:14px;color:var(--sea);padding:6px 8px 6px 0}
.bar h2{margin:0;font-family:var(--f-en);font-weight:500;font-size:20px;line-height:1.2;flex:1;min-width:0;text-wrap:balance}
.bar .lnum{font-size:12px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{padding:8px 0;border-radius:7px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--sea-soft);color:var(--ink);font-weight:500}
.panel{padding-top:8px}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--surface)}
.chip[aria-pressed="true"]{border-color:var(--sea);color:var(--sea)}
.words{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.w{display:grid;grid-template-columns:1fr auto 36px;align-items:center;gap:10px;padding:11px 12px 11px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.w:last-child{border-bottom:0}
.w .e{font-family:var(--f-en);font-size:19px;min-width:0}
.w .z{font-size:14px;color:var(--muted);text-align:right;transition:filter .15s}
.hide .w .z{filter:blur(6px)}
.hide .w.peek .z{filter:none}
.w.playing{background:var(--sea-soft)}
.star{font-size:17px;color:var(--line);text-align:center;padding:4px 0}
.star.on{color:var(--rec)}

.gram h3{font-size:16px;margin:4px 0 6px}
.gram p{margin:0 0 12px;max-width:34em}
.ex{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--sea);padding:2px 0 2px 14px;margin:14px 0}
.ex button{text-align:left;font-family:var(--f-en);font-size:18px;line-height:1.35;padding:4px 0}
.ex .zh{font-size:13px;color:var(--muted);margin-bottom:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:14px}
.card .pos{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.card .sent{font-family:var(--f-en);font-size:27px;line-height:1.3;margin:6px 0 0;text-wrap:balance;min-height:2.6em}
.card .sent .wd{border-radius:4px;transition:background .1s}
.card .sent .wd.on{background:var(--sea-soft)}
.card .czh{font-size:14px;color:var(--muted);min-height:1.6em}
.card .czh.hid{filter:blur(6px)}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);border-radius:12px;padding:13px 6px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bg)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--surface)}
.btn.rec{color:var(--rec);border-color:var(--rec)}
.btn.rec.live{background:var(--rec);color:var(--surface)}
.btn[disabled]{opacity:.4;cursor:default}
.ico{width:16px;height:16px;flex:none}
.steps{display:flex;justify-content:space-between;align-items:center;gap:8px}
.steps .btn{flex:1}
.tally{font-size:12.5px;color:var(--muted);text-align:center}
.tally b{color:var(--ok);font-weight:500}
.how{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.75}
.upload{display:none;font-size:13px;color:var(--muted);gap:8px;align-items:center;flex-wrap:wrap}
.upload.show{display:flex}
.upload label{border:1px dashed var(--rec);color:var(--rec);border-radius:10px;padding:8px 12px;cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.finish{width:100%;margin-top:18px}
.ipa,.sym{font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI","Noto Sans",sans-serif}
.phbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin:-8px 0 22px}
.phbtn small{display:block;font-size:12px;color:var(--muted)}
.phbtn .ipa{color:var(--sea);font-size:17px;white-space:nowrap}
.wl{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.w .ipa{font-size:14px;color:var(--sea);padding:1px 0;text-align:left;border-bottom:1px dotted var(--sea);line-height:1.4}
.us{font-size:11.5px;color:var(--muted);margin-top:2px}
.gp{padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.gp:last-of-type{border-bottom:0}
.gk,.ek{font-size:11.5px;letter-spacing:.1em;color:var(--muted);margin:0 0 4px}
.gb{color:var(--ink)}
.forms{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fr{display:grid;grid-template-columns:76px 1fr;align-items:baseline;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.fr:last-child{border-bottom:0}
.fl{font-size:12px;color:var(--muted)}
.fe{font-family:var(--f-en);font-size:17.5px;line-height:1.35;text-align:left;min-width:0}
.fe:active{color:var(--sea)}
.errs{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.er{padding:0 0 0 2px}
.bad,.good{display:flex;gap:8px;align-items:baseline}
.bad s{font-family:var(--f-en);font-size:16px;color:var(--rec);text-decoration-thickness:1px}
.good .fe{color:var(--ok)}
.mk{font-size:13px;width:14px;flex:none}
.bad .mk{color:var(--rec)} .good .mk{color:var(--ok)}
.why{font-size:12.5px;color:var(--muted);padding-left:22px}
.ext .xr{padding:6px 0}
.ext .xr p{margin:0;font-size:13.5px;color:var(--muted)}
.quiz{display:flex;flex-direction:column;gap:8px}
.qz{display:flex;justify-content:space-between;align-items:baseline;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.qq{font-family:var(--f-en);font-size:16.5px;min-width:0}
.qa{font-size:13px;color:var(--sea);white-space:nowrap;filter:blur(5px);transition:filter .15s}
.qz.show .qa{filter:none}
.qz.show{border-color:var(--sea)}
.phs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.phs{grid-template-columns:1fr}}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.phh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sym{font-size:26px;color:var(--sea);line-height:1.1}
.pht{font-size:11.5px;color:var(--muted)}
.tip{font-size:12.5px;color:var(--muted);margin:0;line-height:1.6}
.phx{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pw{font-family:var(--f-en);font-size:17px;border:1px solid var(--line);border-radius:8px;padding:3px 10px;background:var(--bg)}
.pw b{color:var(--sea);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.pw.on{border-color:var(--sea);background:var(--sea-soft)}
#sheet{position:fixed;inset:0;z-index:20}
.sh-bg{position:absolute;inset:0;background:rgba(10,14,16,.45)}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh>*{max-width:560px;margin-left:auto;margin-right:auto}
.shh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.shw{font-size:26px}
.ipa.big{font-size:18px;color:var(--sea);flex:1}
.shx{font-size:14px;color:var(--sea)}
.hr{display:flex;align-items:center;gap:10px}
.rate{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.rate input{flex:1;min-width:0;accent-color:var(--sea)}
.vr .vn{font-size:16px}
.vr.sel{background:var(--sea-soft)}
.vr.sel .z{color:var(--sea)}
.guide{margin-top:22px;font-size:13px;line-height:1.75;color:var(--muted)}
.guide p{margin:0 0 10px}
.guide b{color:var(--ink);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.92}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* 每单元 = 新概念一册的一对课（奇数课课文 + 偶数课练习）。

const U=[
{n:1,t:"Excuse me!",g:"一般疑问句 Is this your…?",gb:"把 be 动词 is 提到句首就变成疑问句。肯定回答 Yes, it is.，否定回答 No, it isn't.（isn't = is not）。回答时不能缩写成 Yes, it's.",gx:[["This is your pen.","这是你的笔。"],["Is this your pen?","这是你的笔吗？"]],w:[["excuse","原谅"],["me","我（宾格）"],["yes","是的"],["this","这"],["your","你的，你们的"],["handbag","女用手提包"],["pardon","原谅，请再说一遍"],["it","它"],["thank you","谢谢你"],["very much","非常地"],["pen","钢笔"],["pencil","铅笔"],["watch","手表"],["coat","上衣，外衣"],["skirt","裙子"],["shirt","衬衫"],["house","房子"]],s:[["Excuse me.","对不起，打扰一下。"],["Is this your key?","这是你的钥匙吗？"],["Yes, it is.","是的，是我的。"],["Is this your coat? No, it isn't.","这是你的外衣吗？不，不是。"],["Pardon?","请再说一遍？"],["Thank you very much.","非常感谢。"]]},
{n:3,t:"Sorry, sir.",g:"祈使句 + please；数字 1–10",gb:"请别人做事，用名词或动词原形开头，加 please 更礼貌：My coat, please.  Here is… 意思是「给你…」。数字 one 到 ten 要能脱口而出。",gx:[["My umbrella, please.","请把我的伞给我。"],["Here is your ticket.","这是您的票。"]],w:[["umbrella","伞"],["please","请"],["here","这里"],["my","我的"],["ticket","票"],["number","号码"],["five","五"],["sorry","对不起"],["sir","先生"],["cloakroom","衣帽存放处"],["suit","一套衣服"],["school","学校"],["teacher","老师"],["son","儿子"],["daughter","女儿"]],s:[["My coat and my umbrella, please.","请把我的外衣和伞给我。"],["Here is your ticket.","这是您的票。"],["Number seven.","七号。"],["Sorry, sir. This isn't your umbrella.","对不起，先生，这不是您的伞。"],["Here's your key, sir.","先生，这是您的钥匙。"]]},
{n:5,t:"Nice to meet you.",g:"介绍他人；国籍形容词",gb:"介绍用 This is…。说国籍：主语 + be + 国籍形容词，如 He is Chinese.  问车或物品的牌子用 What make is it?",gx:[["This is Mr. Wang.","这位是王先生。"],["He is Chinese.","他是中国人。"]],w:[["Mr.","先生"],["good","好"],["morning","早晨"],["Miss","小姐"],["new","新的"],["student","学生"],["French","法国人，法国的"],["German","德国人，德国的"],["nice","美好的"],["meet","遇见"],["Japanese","日本人，日本的"],["Korean","韩国人，韩国的"],["Chinese","中国人，中国的"],["too","也"],["make","牌子"],["English","英国人，英国的"],["American","美国人，美国的"],["Italian","意大利人，意大利的"]],s:[["Good morning.","早上好。"],["This is Miss Li. She's a new student.","这位是李小姐，她是新同学。"],["He's Chinese.","他是中国人。"],["Nice to meet you.","很高兴认识你。"],["What make is it? It's a German car.","这是什么牌子？是德国车。"]]},
{n:7,t:"Are you a teacher?",g:"am / is / are；a 与 an",gb:"I 配 am，you 配 are，he/she/it 配 is。问职业：What's your job?  元音音素开头的词前用 an：an engineer, an air hostess。",gx:[["I am an engineer.","我是工程师。"],["What's your job?","你做什么工作？"]],w:[["I","我"],["am","是"],["are","是"],["name","名字"],["what","什么"],["nationality","国籍"],["job","工作"],["engineer","工程师"],["policeman","警察"],["taxi driver","出租车司机"],["postman","邮递员"],["nurse","护士"],["mechanic","机械师"],["hairdresser","理发师"],["housewife","家庭主妇"]],s:[["What's your name? My name's Fukui.","你叫什么名字？我叫 Fukui。"],["What nationality are you? I'm Chinese.","你是哪国人？我是中国人。"],["Are you a teacher? No, I'm not.","你是老师吗？不是。"],["What's your job? I'm a manager.","你做什么工作？我是经理。"],["She's an engineer.","她是工程师。"]]},
{n:9,t:"How are you today?",g:"问候语；形容词作表语",gb:"How are you? 回答 I'm fine / very well, thank you. And you?  形容词放在 be 后面描述人或物：He is busy. 否定加 not：He isn't lazy.",gx:[["How is Tim today?","蒂姆今天怎么样？"],["He's very well.","他很好。"]],w:[["hello","喂，你好"],["hi","你好"],["how","怎样"],["today","今天"],["well","身体好"],["fine","美好的"],["thanks","谢谢"],["goodbye","再见"],["see","见"],["fat","胖的"],["thin","瘦的"],["tall","高的"],["short","矮的"],["dirty","脏的"],["clean","干净的"],["hot","热的"],["cold","冷的"],["old","老的"],["young","年轻的"],["busy","忙的"],["lazy","懒的"]],s:[["Hello. How are you today?","你好，今天怎么样？"],["I'm very well, thank you. And you?","我很好，谢谢。你呢？"],["I'm fine, thanks.","我很好，谢谢。"],["He isn't busy. He's lazy.","他不忙，他是懒。"],["See you tomorrow.","明天见。"]]},

{n:51,t:"A pleasant climate",g:"一般现在时 + 频度副词",gb:"频度副词：always 总是，often 经常，sometimes 有时，never 从不。放在实义动词前、be 动词后：It often rains. It is always warm.  问天气：What's the climate like?",gx:[["What's the climate like in your country?","你们国家气候怎么样？"],["It often rains in spring.","春天经常下雨。"]],w:[["Greece","希腊"],["climate","气候"],["country","国家"],["pleasant","宜人的"],["weather","天气"],["spring","春天"],["windy","有风的"],["warm","温暖的"],["rain","下雨"],["sometimes","有时"],["summer","夏天"],["autumn","秋天"],["winter","冬天"],["snow","下雪"],["January","一月"],["April","四月"],["July","七月"],["October","十月"]],s:[["Where do you come from? I come from China.","你是哪里人？我来自中国。"],["What's the climate like in your country?","你们国家气候怎么样？"],["It's very pleasant.","非常宜人。"],["It often rains in spring.","春天经常下雨。"],["It sometimes snows in winter.","冬天有时下雪。"]]},
{n:53,t:"An interesting climate",g:"第三人称单数 -s 变化规则",gb:"动词加 s 的规则：多数直接加 s（rise → rises）；以 s, x, ch, sh, o 结尾加 es（go → goes, watch → watches）；辅音 + y 改 y 为 ies（cry → cries）。",gx:[["The sun rises early in summer.","夏天太阳升得早。"],["Which season do you like best?","你最喜欢哪个季节？"]],w:[["interesting","有趣的"],["subject","话题"],["conversation","谈话"],["mild","温和的"],["always","总是"],["north","北方"],["east","东方"],["wet","潮湿的"],["west","西方"],["south","南方"],["season","季节"],["best","最好地"],["night","夜晚"],["rise","升起"],["early","早"],["set","落下"],["late","晚"]],s:[["Our climate isn't very good, but it's interesting.","我们的气候不算好，但很有意思。"],["The weather is always a subject of conversation.","天气总是聊天的话题。"],["Winter is wet in the south.","南方冬天潮湿。"],["The sun rises early in summer.","夏天太阳升得早。"],["Which season do you like best? I like autumn best.","你最喜欢哪个季节？秋天。"]]},

{n:57,t:"An unusual day",g:"一般现在时 vs 现在进行时",gb:"习惯用一般现在时（usually, every day），此刻正在发生用现在进行时（now, today, at the moment）：He usually drinks tea, but today he's drinking coffee.",gx:[["She usually goes by bus.","她通常坐公交。"],["But today she's walking.","但今天她在走路。"]],w:[["o'clock","…点钟"],["shop","商店"],["moment","片刻"],["at the moment","此刻"]],s:[["It's eight o'clock.","现在八点了。"],["The children usually go to school by bus, but today they're walking.","孩子们通常坐公交上学，今天是走路去。"],["At the moment, she's reading a book.","此刻她正在看书。"],["He usually drinks tea, but today he's drinking coffee.","他平时喝茶，今天却在喝咖啡。"],["What time is it? It's ten o'clock.","几点了？十点。"]]},
{n:59,t:"Is that all?",g:"have 与 some / any",gb:"have 表示「有」，第三人称用 has。肯定句用 some，疑问和否定用 any：Do you have any glue? I don't have any.  购物常用：Is that all? 就这些吗？",gx:[["Do you have any envelopes?","有信封吗？"],["I have some.","有一些。"]],w:[["envelope","信封"],["writing paper","信纸"],["shop assistant","店员"],["size","尺寸"],["pad","便笺本"],["glue","胶水"],["chalk","粉笔"],["change","零钱"]],s:[["I want some envelopes, please.","我想买些信封。"],["Do you want the large size or the small size?","要大号还是小号？"],["Do you have any writing paper?","有信纸吗？"],["I don't have any glue.","我没有胶水。"],["Is that all? Here's your change.","就这些吗？这是找您的零钱。"]]},
{n:61,t:"A bad cold",g:"have 表示患病；must",gb:"生病用 have：have a cold（感冒）, have a headache（头疼）, have a temperature（发烧）。must 表示必须：You must stay in bed.",gx:[["What's the matter with him?","他怎么了？"],["He has a bad cold.","他得了重感冒。"]],w:[["feel","感觉"],["look","看起来"],["must","必须"],["call","叫"],["doctor","医生"],["telephone","打电话"],["remember","记得"],["mouth","嘴"],["tongue","舌头"],["bad","严重的"],["cold","感冒"],["news","消息"]],s:[["How do you feel today?","你今天感觉怎么样？"],["I feel ill.","我觉得不舒服。"],["He has a bad cold.","他得了重感冒。"],["You must stay in bed.","你必须卧床休息。"],["Open your mouth, please.","请张开嘴。"]]},
{n:63,t:"Thank you, doctor.",g:"must 与 mustn't",gb:"mustn't = must not，表示「禁止，一定不要」：He mustn't get up yet.  注意 mustn't 不等于「不必」。yet 用在否定句末，意为「还（没）」。",gx:[["Can he get up now?","他现在能起床了吗？"],["No, he mustn't get up yet.","不行，他还不能起来。"]],w:[["better","更好的"],["certainly","当然"],["get up","起床"],["yet","还"],["rich","油腻的"],["food","食物"],["remain","保持"],["quiet","安静的"]],s:[["Is he better now, doctor?","医生，他好些了吗？"],["He mustn't get up yet.","他还不能起床。"],["He must stay in bed for another two days.","他还得再躺两天。"],["He mustn't eat rich food.","他不能吃油腻的东西。"],["You must keep the room quiet.","你们得保持房间安静。"]]},

const PHM={}; PH.forEach(p=>PHM[p[0]]=p);
const RCOMBO=["ɑːr","ɔːr","ɪr","er","ʊr"], VOW="iɪeæɑɔʊuʌəɚɝaoː";
const SYMS=PH.map(p=>p[0]).sort((a,b)=>b.length-a.length);
function ipaTokens(s){
  const out=[]; let i=0; s=s.replace(/[ˈˌ\s]/g,"");
  while(i<s.length){
    let hit=null;
    for(const sym of SYMS){
      if(s.startsWith(sym,i)){
        if(RCOMBO.includes(sym)&&i+sym.length<s.length&&VOW.includes(s[i+sym.length])) continue;
        hit=sym;break;}
    }
    if(!hit){i++;continue}
    out.push(hit); i+=hit.length;
  }
  return out;
}

const KEY="nce1-v1";

/* speech */
let voice=null;
const NOVELTY=/(Fred|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Wobble|Zarvox|Trinoids|Whisper|Jester|Organ|Superstar|Junior|Ralph|Kathy|Princess|Good News|Hysterical|Deranged|Pipe|Grandma|Grandpa|Rocko|Shelley|Sandy|Flo|Eddy|Reed)/i;
function voiceScore(v){
  let s=0; const n=v.name;
  if(/en[-_]US/i.test(v.lang)) s+=20;
  if(/premium|高级/i.test(n)) s+=8; else if(/enhanced|增强/i.test(n)) s+=6;
  if(/natural|neural|online/i.test(n)) s+=6;
  if(/Google US English/i.test(n)) s+=5;
  if(/(Ava|Zoe|Allison|Samantha|Nicky|Evan|Tom|Susan|Aria|Jenny|Guy|Michelle)/i.test(n)) s+=3;
  if(NOVELTY.test(n)) s-=50;
  return s;
}
function enVoices(){ if(!("speechSynthesis" in window)) return []; return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a)); }
function pickVoice(){
  const vs=enVoices(); if(!vs.length) return;
  voice=(st.voice&&vs.find(v=>v.voiceURI===st.voice))||vs[0];
}
if("speechSynthesis" in window){setTimeout(pickVoice,0); speechSynthesis.onvoiceschanged=()=>{pickVoice(); if(document.getElementById("vlist")) settings();};}
function speak(text,rate=0.9,onword,onend){
  if(!("speechSynthesis" in window)){toast("这台设备不支持朗读");onend&&onend();return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(voice){u.voice=voice;u.lang=voice.lang}else u.lang="en-US";
  u.rate=Math.max(0.4,Math.min(1.4,rate*((st.rate||0.9)/0.9)));
  if(onword) u.onboundary=e=>{if(e.name==="word"||e.name===undefined) onword(e.charIndex)};
  u.onend=()=>onend&&onend(); u.onerror=()=>onend&&onend();
  speechSynthesis.speak(u);
}

/* recording */
let rec=null, chunks=[], myURL=null, recOK=null;
async function startRec(btn,onDone){
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    recOK=true; chunks=[];
    rec=new MediaRecorder(s);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());
      if(myURL) URL.revokeObjectURL(myURL);
      myURL=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||"audio/webm"})); onDone(true);};
    rec.start(); return true;
  }catch(e){recOK=false; onDone(false); return false;}
}
function playMine(){ if(!myURL) return; const a=new Audio(myURL); a.play().catch(()=>toast("播放失败")); }

  <div class="tools" style="margin-top:10px"><button class="chip" id="allv" aria-pressed="${showAll}">显示全部英语声音</button></div>
  <div class="guide">
    <p class="ek">声音听起来怪，多半是用了系统自带的精简版声音</p>
    <p><b>iPhone：</b>设置 → 辅助功能 → 朗读内容 → 声音 → 英语 → 英语（美国）→ 选 Ava、Zoe 或 Evan，点「高级」版本下载（每个约 300 MB，建议连 Wi-Fi）。下载完彻底关掉 app 再打开，回到这里选带「高级 / Premium」的那一个。</p>
    <p><b>安卓：</b>设置 → 系统 → 语言和输入法 → 文字转语音 → 首选引擎选「Google 语音服务」→ 安装语音数据 → 英语（美国）→ 选一个声音下载。部分国产手机自带引擎读英语效果较差，可以在应用商店安装「Google 语音服务」。</p>
    <p>这是手机系统自带的朗读，高质量声音会自然很多，但还是比不上真人录音，语调可以参考，细节以教材原声为准。</p>
  </div>`;
  $("#back").onclick=home;
  const r=$("#rate");
  r.oninput=()=>{st.rate=+r.value;$("#rv").textContent=(+r.value).toFixed(2);save();};
  $("#rtest").onclick=()=>speak("Excuse me. Is this your handbag?",0.9);
  document.querySelectorAll(".vr").forEach(row=>{const go=()=>{
      const v=vs.find(x=>x.voiceURI===row.dataset.u); if(!v) return;
      voice=v; st.voice=v.voiceURI; save();
      document.querySelectorAll(".vr").forEach(x=>{x.classList.toggle("sel",x===row);x.querySelector(".z").textContent=x===row?"使用中":"试听";});
      speak("Nice to meet you. How are you today?",0.9);};
    row.onclick=go; row.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};});
  $("#allv").onclick=()=>{st.allVoices=!showAll;save();settings();};
  window.scrollTo(0,0);
}
function phonetics(from){
  speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();
  $("#app").innerHTML=`
  <div class="bar"><div class="head"><button class="back" id="back">‹ ${from?"返回本课":"目录"}</button><h2>美式音标表</h2><span class="lnum mono">${PH.length} 个</span></div></div>
  <p class="how" style="margin-top:0">标注采用剑桥词典美式（US）体系，查词时可以直接对照。手机朗读引擎读不出单独的音标，所以每个音标配了 3 个例词，加粗的字母就是这个音。先看口型提示，再听例词，最后自己把这个音单独发出来。</p>
  ${PHG.map(g=>`<p class="label" style="margin-top:22px">${g[0]}</p><div class="phs">${PH.slice(g[1],g[2]).map(phCard).join("")}</div>`).join("")}`;
  bindPw($("#app"));
  $("#back").onclick=()=>from?lesson(from,"w"):home();
  window.scrollTo(0,0);
}

function shadow(){
  const s=cur.s[si]; const reps=(st.rep[cur.n]||{})[si]||0;
  if(myURL){URL.revokeObjectURL(myURL);myURL=null}
  const toks=s[0].split(/(\s+)/);
  $("#panel").innerHTML=`
  <div class="card">
    <div class="pos"><span class="mono">${si+1} / ${cur.s.length}</span><button id="hz2" class="chip" style="padding:2px 10px" aria-pressed="${hideZh}">遮住中文</button></div>
    <p class="sent" id="sent">${toks.map(t=>/\s/.test(t)?t:`<span class="wd">${esc(t)}</span>`).join("")}</p>
    <div class="czh ${hideZh?"hid":""}" id="czh">${esc(s[1])}</div>
    <div class="ctrls">
      <button class="btn primary" id="p1">${icon.play} 示范</button>
      <button class="btn" id="p2">${icon.slow} 慢速</button>
      <button class="btn rec" id="rc">${icon.mic} <span>录我的</span></button>
      <button class="btn" id="pm" disabled>${icon.ear} 听我的</button>
    </div>
    <div class="upload" id="up"><span>这个窗口里麦克风用不了。可以用手机录音后选文件：</span><label>选择录音<input type="file" id="fi" accept="audio/*" capture></label></div>
    <div class="tally" id="tally">${reps?`这句已跟读 <b>${reps}</b> 遍`:"听一遍，跟着大声说一遍"}</div>
    <div class="steps">
      <button class="btn" id="prev" ${si===0?"disabled":""}>‹ 上一句</button>
      <button class="btn" id="said">我说了 +1</button>
      <button class="btn" id="next">${si===cur.s.length-1?"完成":"下一句 ›"}</button>
    </div>
  </div>
  <p class="how">建议节奏：示范 → 跟说 → 慢速 → 再跟说。能录音时，录一遍和示范对比，重点听尾音（-s、-ed）和句尾升降调。</p>`;
  const spans=[...document.querySelectorAll("#sent .wd")];
  const starts=[]; {let p=0; toks.forEach(t=>{if(!/\s/.test(t)) starts.push(p); p+=t.length;});}
  const hl=ci=>{let k=0; for(let i=0;i<starts.length;i++) if(starts[i]<=ci) k=i; spans.forEach((x,i)=>x.classList.toggle("on",i===k));};
  const clr=()=>spans.forEach(x=>x.classList.remove("on"));
  $("#p1").onclick=()=>speak(s[0],0.9,hl,clr);
  $("#p2").onclick=()=>speak(s[0],0.6,hl,clr);
  $("#hz2").onclick=()=>{hideZh=!hideZh;$("#czh").classList.toggle("hid",hideZh);$("#hz2").setAttribute("aria-pressed",hideZh)};
  $("#czh").onclick=()=>$("#czh").classList.toggle("hid");
  const rc=$("#rc"), pm=$("#pm");
  if(recOK===false) $("#up").classList.add("show");
  rc.onclick=async()=>{
    if(rec&&rec.state==="recording"){rec.stop();rc.classList.remove("live");rc.querySelector("span").textContent="重录";return;}
    speechSynthesis.cancel();
    rc.classList.add("live"); rc.querySelector("span").textContent="停止";
    await startRec(rc,ok=>{
      if(ok&&myURL){pm.disabled=false; bump(); playMine();}
      if(!ok){rc.classList.remove("live");rc.querySelector("span").textContent="录我的";$("#up").classList.add("show");}
    });
  };
  pm.onclick=playMine;
  $("#fi").onchange=e=>{const f=e.target.files[0]; if(!f) return;
    if(myURL) URL.revokeObjectURL(myURL); myURL=URL.createObjectURL(f); pm.disabled=false; bump(); playMine();};
  $("#said").onclick=()=>{bump();toast("+1")};
  $("#prev").onclick=()=>{si--;shadow()};
  $("#next").onclick=()=>{ if(si<cur.s.length-1){si++;shadow()} else {st.done[cur.n]=1;save();toast("本单元完成");setTimeout(home,700);} };
}
function bump(){
  st.rep[cur.n]=st.rep[cur.n]||{}; st.rep[cur.n][si]=(st.rep[cur.n][si]||0)+1; save();
  const t=$("#tally"); if(t) t.innerHTML=`这句已跟读 <b>${st.rep[cur.n][si]}</b> 遍`;
}

home();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
